<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дурак Онлайн</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background-color: #142617; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 94vh; overflow: hidden; user-select: none; }
        .game-title { font-size: 20px; font-weight: bold; color: #ffd700; margin-top: 5px; }
        .cards-row { display: flex; justify-content: center; width: 100%; height: 85px; margin: 5px 0; min-height: 85px; }
        .playing-table { border: 3px dashed #3a6b43; background-color: #1a3c22; border-radius: 20px; width: 92%; max-width: 365px; height: 200px; display: flex; align-items: center; justify-content: center; position: relative; }
        .table-placeholder { color: #82b98b; font-size: 14px; text-align: center; padding: 15px; z-index: 5; font-weight: bold; }
        .card { width: 52px; height: 78px; background-color: white; border-radius: 6px; box-shadow: 2px 2px 7px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; padding: 5px; box-sizing: border-box; font-weight: bold; font-size: 14px; margin-left: -18px; transition: all 0.3s ease; position: relative; cursor: pointer; }
        .card:first-child { margin-left: 0; }
        .card.back { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); border: 2px solid white; cursor: default; }
        .red { color: #e53935; } .black { color: #212121; }
        .trump-card { position: absolute; right: 10px; top: 60px; transform: rotate(90deg); z-index: 1; }
        .deck-back { position: absolute; right: 16px; top: 60px; z-index: 2; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; text-shadow: 1px 1px 2px black; }
        .table-cards-container { display: flex; gap: 15px; z-index: 6; position: absolute; }
        .action-btn { background: linear-gradient(180deg, #ffe047 0%, #f1b600 100%); color: #422100; border: none; border-radius: 12px; padding: 12px 0; font-size: 16px; font-weight: bold; cursor: pointer; width: 90%; max-width: 340px; margin-bottom: 5px; text-align: center; }
        .game-status-tag { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="game-title">🃏 ДУРАК CLUB</div>
    <div class="game-status-tag" id="bot-status-tag">Ожидание...</div>
    <div class="cards-row" id="bot-cards"></div>
    <div class="playing-table">
        <div class="table-placeholder" id="table-info">Нажмите кнопку ниже для раздачи карт</div>
        <div class="table-cards-container" id="table-cards"></div>
        <div id="deck-area" style="display:none;">
            <div class="card trump-card" id="trump-element"></div>
            <div class="card back deck-back" id="deck-count-element">24</div>
        </div>
    </div>
    <div class="game-status-tag" id="player-status-tag">Игрок</div>
    <div class="cards-row" id="player-cards" style="height: 90px;"></div>
    <button class="action-btn" id="action-button" onclick="handleMainAction()">НАЧАТЬ ИГРУ</button>
        <script>
        let telegramUserName = "Игрок";
        if (window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name) {
            telegramUserName = window.Telegram.WebApp.initDataUnsafe.user.first_name;
        }

        const ranks = {'6':6, '7':7, '8':8, '9':9, '10':10, 'J':11, 'Q':12, 'K':13, 'A':14};
        const suits = [{'icon':'♠','color':'black'}, {'icon':'♣','color':'black'}, {'icon':'♦','color':'red'}, {'icon':'♥','color':'red'}];
        const botNames = ["Робот Барбарис", "Робот Валера", "Робот Процессор", "Робот Сириус", "Робот Кабан"];
        let currentBotName = "Робот";
        
        let deck = [], playerHand = [], botHand = [], trumpSuit = null, gameActive = false;
        let currentTurn = 'player', currentAttackCard = null, currentDefenseCard = null;

        function startNewGame() {
            deck = [];
            for (let suit of suits) {
                for (let rank in ranks) { deck.push({ rank: rank, suit: suit }); }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            currentBotName = botNames[Math.floor(Math.random() * botNames.length)];
            playerHand = deck.splice(0, 6);
            botHand = deck.splice(0, 6);
            let trumpCard = deck[deck.length - 1];
            trumpSuit = trumpCard.suit;
            
            const trumpEl = document.getElementById('trump-element');
            trumpEl.className = "card " + trumpSuit.color + " trump-card";
            trumpEl.innerHTML = "<div>" + trumpCard.rank + "</div><div style='align-self:center;font-size:18px;'>"+trumpSuit.icon+"</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + trumpCard.rank + "</div>";
            
            document.getElementById('deck-area').style.display = 'block';
            document.getElementById('table-info').style.display = 'none';
            
            gameActive = true;
            currentTurn = 'player'; 
            currentAttackCard = null; currentDefenseCard = null;
            
            document.getElementById('table-cards').innerHTML = "";
            updateActionButton();
            renderHands();
        }
                   function renderHands() {
            let pMark = (currentTurn === 'player') ? "👉 " : "";
            let bMark = (currentTurn === 'bot') ? "👉 " : "";
            document.getElementById('player-status-tag').innerText = pMark + telegramUserName + " (" + playerHand.length + " шт.)";
            document.getElementById('bot-status-tag').innerText = bMark + currentBotName + " (" + botHand.length + " шт.)";
            
            const dCount = document.getElementById('deck-count-element');
            if (deck.length > 0) { dCount.style.display = 'flex'; dCount.innerText = deck.length; }
            else { dCount.style.display = 'none'; }
            
            const pRow = document.getElementById('player-cards'); pRow.innerHTML = "";
            playerHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = "card " + card.suit.color;
                cardEl.innerHTML = "<div>" + card.rank + "</div><div style='align-self:center;font-size:18px;'>" + card.suit.icon + "</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + card.suit.icon + "</div>";
                cardEl.onclick = () => playerClickCard(index);
                pRow.appendChild(cardEl);
            });
            
            const bRow = document.getElementById('bot-cards'); bRow.innerHTML = "";
            botHand.forEach(() => {
                const cardEl = document.createElement('div'); cardEl.className = "card back"; bRow.appendChild(cardEl);
            });
        }

        function playerClickCard(cardIndex) {
            if (!gameActive) return;
            if (currentTurn === 'player' && currentAttackCard === null) {
                currentAttackCard = playerHand.splice(cardIndex, 1)[0];
                const tCards = document.getElementById('table-cards'); tCards.innerHTML = "";
                const cardEl = document.createElement('div'); cardEl.className = "card " + currentAttackCard.suit.color; cardEl.style.marginLeft = "0";
                cardEl.innerHTML = "<div>" + currentAttackCard.rank + "</div><div style='align-self:center;font-size:18px;'>" + currentAttackCard.suit.icon + "</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + currentAttackCard.rank + "</div>";
                tCards.appendChild(cardEl);
                renderHands(); updateActionButton();
                setTimeout(botDefenseLogic, 800);
            }
            else if (currentTurn === 'bot' && currentAttackCard !== null && currentDefenseCard === null) {
                const card = playerHand[cardIndex]; let canBeat = false;
                if (card.suit.icon === currentAttackCard.suit.icon && ranks[card.rank] > ranks[currentAttackCard.rank]) canBeat = true;
                if (currentAttackCard.suit.icon !== trumpSuit.icon && card.suit.icon === trumpSuit.icon) canBeat = true;
                if (canBeat) {
                    currentDefenseCard = playerHand.splice(cardIndex, 1)[0];
                    const tCards = document.getElementById('table-cards');
                    const cardEl = document.createElement('div'); cardEl.className = "card " + currentDefenseCard.suit.color; cardEl.style.marginLeft = "-25px"; cardEl.style.transform = "translateY(15px) rotate(8deg)";
                    cardEl.innerHTML = "<div>" + currentDefenseCard.rank + "</div><div style='align-self:center;font-size:18px;'>" + currentDefenseCard.suit.icon + "</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + currentDefenseCard.rank + "</div>";
                    tCards.appendChild(cardEl);
                    renderHands(); updateActionButton();
                }
            }
        }
                         function botDefenseLogic() {
            let idx = -1, best = 999;
            for (let i = 0; i < botHand.length; i++) {
                const c = botHand[i]; let cb = false;
                if (c.suit.icon === currentAttackCard.suit.icon && ranks[c.rank] > ranks[currentAttackCard.rank]) cb = true;
                if (currentAttackCard.suit.icon !== trumpSuit.icon && c.suit.icon === trumpSuit.icon) cb = true;
                if (cb) {
                    let w = ranks[c.rank] + (c.suit.icon === trumpSuit.icon ? 20 : 0);
                    if (w < best) { best = w; idx = i; }
                }
            }
            if (idx !== -1) {
                currentDefenseCard = botHand.splice(idx, 1)[0];
                const tCards = document.getElementById('table-cards');
                const cardEl = document.createElement('div'); cardEl.className = "card " + currentDefenseCard.suit.color; cardEl.style.marginLeft = "-25px"; cardEl.style.transform = "translateY(15px) rotate(8deg)";
                cardEl.innerHTML = "<div>" + currentDefenseCard.rank + "</div><div style='align-self:center;font-size:18px;'>" + currentDefenseCard.suit.icon + "</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + currentDefenseCard.rank + "</div>";
                tCards.appendChild(cardEl); renderHands();
            } else { currentDefenseCard = null; }
            updateActionButton();
        }

        function botAttackLogic() {
            if (!gameActive || botHand.length === 0) return;
            let idx = 0, best = 999;
            for (let i = 0; i < botHand.length; i++) {
                let w = ranks[botHand[i].rank] + (botHand[i].suit.icon === trumpSuit.icon ? 20 : 0);
                if (w < best) { best = w; idx = i; }
            }
            currentAttackCard = botHand.splice(idx, 1)[0]; currentDefenseCard = null;
            const tCards = document.getElementById('table-cards'); tCards.innerHTML = "";
            const cardEl = document.createElement('div'); cardEl.className = "card " + currentAttackCard.suit.color; cardEl.style.marginLeft = "0";
            cardEl.innerHTML = "<div>" + currentAttackCard.rank + "</div><div style='align-self:center;font-size:18px;'>" + currentAttackCard.suit.icon + "</div><div style='align-self:flex-end;transform:rotate(180deg);'>" + currentAttackCard.rank + "</div>";
            tCards.appendChild(cardEl); renderHands(); updateActionButton();
        }
                   function updateActionButton() {
            const btn = document.getElementById('action-button');
            if (!gameActive) { btn.innerHTML = "НАЧАТЬ ИГРУ"; btn.style.background = "linear-gradient(180deg, #ffe047 0%, #f1b600 100%)"; btn.style.color = "#422100"; return; }
            btn.style.color = "#fff";
            if (currentTurn === 'player') {
                if (currentAttackCard === null) { btn.innerHTML = "ВАШ ХОД (Выберите карту)"; btn.style.background = "#555555"; }
                else if (currentDefenseCard !== null) { btn.innerHTML = "БИТО (Ход к боту)"; btn.style.background = "#2ec753"; }
                else { btn.innerHTML = "БОТ ДУМАЕТ..."; btn.style.background = "#555555"; }
            } else {
                if (currentAttackCard === null) { btn.innerHTML = "ОЖИДАНИЕ БОТА"; btn.style.background = "#555555"; }
                else if (currentDefenseCard !== null) { btn.innerHTML = "БИТО (Вы отбились!)"; btn.style.background = "#2ec753"; }
                else { btn.innerHTML = "ВЗЯТЬ КАРТУ РОБОТА"; btn.style.background = "#e53935"; }
            }
        }

        function handleMainAction() {
            if (!gameActive) { startNewGame(); return; }
            const btnText = document.getElementById('action-button').innerHTML;
            const tCards = document.getElementById('table-cards');
            
            if (currentTurn === 'player' && btnText.includes("БИТО")) {
                tCards.innerHTML = ""; currentAttackCard = null; currentDefenseCard = null;
                refillHands(); checkVictory(); if (gameActive) { currentTurn = 'bot'; renderHands(); setTimeout(botAttackLogic, 1000); }
            }
            else if (currentTurn === 'player' && currentAttackCard !== null && currentDefenseCard === null) {
                botHand.push(currentAttackCard); tCards.innerHTML = ""; currentAttackCard = null; currentDefenseCard = null;
                refillHands(); checkVictory(); renderHands(); updateActionButton();
            }
            else if (currentTurn === 'bot' && btnText.includes("Вы отбились")) {
                tCards.innerHTML = ""; currentAttackCard = null; currentDefenseCard = null;
                refillHands(); checkVictory(); if (gameActive) { currentTurn = 'player'; renderHands(); updateActionButton(); }
            }
            else if (currentTurn === 'bot' && btnText.includes("ВЗЯТЬ")) {
                playerHand.push(currentAttackCard); tCards.innerHTML = ""; currentAttackCard = null; currentDefenseCard = null;
                refillHands(); checkVictory(); if (gameActive) { renderHands(); setTimeout(botAttackLogic, 1000); }
            }
        }

        function refillHands() {
            while (playerHand.length < 6 && deck.length > 0) { playerHand.push(deck.shift()); }
            while (botHand.length < 6 && deck.length > 0) { botHand.push(deck.shift()); }
        }

        function checkVictory() {
            if (deck.length === 0) {
                if (playerHand.length === 0 && botHand.length === 0) { alert("Ничья!"); resetGame(); }
                else if (playerHand.length === 0) { alert("🎉 ПОЗДРАВЛЯЕМ! Вы выиграли!"); resetGame(); }
                else if (botHand.length === 0) { alert("❌ Вы проиграли!"); resetGame(); }
            }
        }

        function resetGame() { gameActive = false; document.getElementById('deck-area').style.display = 'none'; document.getElementById('table-cards').innerHTML = ""; playerHand = []; botHand = []; renderHands(); updateActionButton(); }
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
    </script>
</body>
</html>
